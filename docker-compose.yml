# Local development stack. Mirrors production topology (migrate-then-serve, scheduled recon job)
# with throwaway credentials. Nothing here can reach AWS.
name: ledgerops

x-ledger-env: &ledger-env
  APP_ENV: local
  LEDGER_BOOK: IN
  DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    command: ["postgres", "-c", "log_min_duration_statement=250", "-c", "max_connections=50"]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot migration job, exactly like the pre-deploy ECS task in staging/prod.
  migrate:
    build: { context: ., dockerfile: apps/ledger-api/Dockerfile }
    image: ledgerops/ledger-api:local
    command: ["dist/migrate.js"]
    environment: *ledger-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  ledger-api:
    image: ledgerops/ledger-api:local
    environment: *ledger-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s

  recon-worker:
    build: { context: apps/recon-worker }
    image: ledgerops/recon-worker:local
    profiles: ["jobs"]
    environment:
      APP_ENV: local
      LEDGER_BOOK: IN
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      STATEMENT_URI: /fixtures/statement-sample.csv
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes: ["./apps/recon-worker/fixtures:/fixtures:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports: ["9091:9091"]

  prometheus:
    image: prom/prometheus:v3.7.2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ledger-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
