[project]
name = "recon-worker"
version = "0.1.0"
description = "Daily reconciliation of ledger balances against broker/custodian statements"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
recon = "recon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
