version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/recon-worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/ledger-api, /apps/recon-worker]
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/live/*]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
